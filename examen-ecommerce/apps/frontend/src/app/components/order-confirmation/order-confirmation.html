<section class="confirmation">
  <h2>¡Compra realizada!</h2>
  <p>
    Orden <strong>{{ order().orderNumber }}</strong> ·
    {{ order().createdAt | date: 'dd/MM/yyyy HH:mm:ss' }}
  </p>
  <app-discount-summary [data]="order()" />
  <button type="button" (click)="closed.emit()">Cerrar</button>
</section>
