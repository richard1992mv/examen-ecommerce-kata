# =====================================================================
# Configuración común (todos los perfiles)
# =====================================================================
spring.application.name=examen-ecommerce-backend
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# --- Zona horaria de negocio (Clock, JDBC e Hibernate usan la misma) ---
app.time-zone=America/Bogota

# --- DataSource: credenciales SOLO por variables de entorno ---
# tinyInt1isBit=false -> TINYINT(1) UNSIGNED se reporta como TINYINT (ver docs/arquitectura.md)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kata_ecommerce?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&tinyInt1isBit=false&connectionTimeZone=America/Bogota&forceConnectionTimeZoneToSession=false}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate: el esquema YA existe ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${app.time-zone}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.sql.init.mode=never

# --- Reglas de descuento (sin porcentajes hardcodeados en el código) ---
discount.volume.pct=5.00
discount.volume.threshold=100.00
discount.cap-pct=35.00

# --- Órdenes ---
order.number.prefix=ORD
order.number.max-attempts=3

# --- Actuator: solo health y metrics ---
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# --- OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Errores: nunca exponer stack trace ni mensajes internos ---
server.error.include-stacktrace=never
server.error.include-message=never

# --- CORS (se sobreescribe por perfil) ---
app.cors.allowed-origins=
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# --- Paginación ---
spring.data.web.pageable.max-page-size=100
