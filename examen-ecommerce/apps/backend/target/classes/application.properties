# =====================================================================
# Configuración común (todos los perfiles)
# =====================================================================
spring.application.name=examen-ecommerce-backend
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/kata_ecommerce?zeroDateTimeBehavior=convertToNull
spring.datasource.username=nacadmin
spring.datasource.password=admin2015
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate: el esquema YA existe ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${app.time-zone}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.sql.init.mode=never

# --- Reglas de descuento (sin porcentajes hardcodeados en el código) ---
discount.volume.pct=5.00
discount.volume.threshold=100.00
discount.cap-pct=35.00

# --- Órdenes ---
order.number.prefix=ORD
order.number.max-attempts=3

# --- OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# --- Seguridad JWT (HS256). Secreto en Base64, minimo 256 bits; sobrescribir con JWT_SECRET fuera de dev ---
# Los usuarios y sus contrasenas (BCrypt) se leen de la tabla app_users de MySQL.
app.jwt.secret=${JWT_SECRET:sQMXlSLkSLGE8RVJOxKTPG+Omna01r2jPqtCUbzpgvQ=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Errores: nunca exponer stack trace ni mensajes internos ---
server.error.include-stacktrace=never
server.error.include-message=never

# --- Paginación ---
spring.data.web.pageable.max-page-size=100
