# =====================================================================
# Perfil test: la URL/credenciales las inyecta Testcontainers (@DynamicPropertySource)
# =====================================================================
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=WARN
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# Reloj fijo: las pruebas NO dependen de la fecha real (WELCOME2026 vence el 2026-12-31)
app.clock.fixed-instant=2026-10-15T12:00:00-05:00

app.cors.allowed-origins=http://localhost:4200
